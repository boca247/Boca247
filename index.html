/* ============================================================
   BOCA 24/7 — BLOQUE 2
   CARGA Y LIMPIEZA DE NOTICIAS
============================================================ */


/* ============================================================
   VARIABLES
============================================================ */

let todasLasNoticias = [];

let seccionActual = "Todas";

let cargandoNoticias = false;


/* ============================================================
   NORMALIZAR TEXTO PARA COMPARAR
============================================================ */

function normalizarTitulo(texto){

    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* ============================================================
   GENERAR CLAVE ÚNICA
============================================================ */

function claveNoticia(noticia){

    const titulo =
        normalizarTitulo(
            noticia.titulo
        );

    const fuente =
        normalizarTitulo(
            noticia.fuente
        );

    /*
       El título es lo principal.

       La fuente ayuda cuando dos notas tienen
       títulos muy parecidos pero pertenecen
       a fuentes diferentes.
    */

    return titulo + "|" + fuente;

}


/* ============================================================
   MEDIR SIMILITUD ENTRE DOS TÍTULOS
============================================================ */

function similitudTitulos(
    tituloA,
    tituloB
){

    const palabrasA =
        normalizarTitulo(
            tituloA
        )
        .split(" ")
        .filter(
            palabra =>
                palabra.length >= 4
        );


    const palabrasB =
        normalizarTitulo(
            tituloB
        )
        .split(" ")
        .filter(
            palabra =>
                palabra.length >= 4
        );


    if(
        palabrasA.length === 0 ||
        palabrasB.length === 0
    ){

        return 0;

    }


    const conjuntoB =
        new Set(
            palabrasB
        );


    let coincidencias = 0;


    for(
        const palabra
        of palabrasA
    ){

        if(
            conjuntoB.has(
                palabra
            )
        ){

            coincidencias++;

        }

    }


    return coincidencias /
        Math.max(
            palabrasA.length,
            palabrasB.length
        );

}


/* ============================================================
   ELIMINAR NOTICIAS REPETIDAS
============================================================ */

function eliminarDuplicadas(
    noticias
){

    const resultado = [];

    const claves = new Set();


    for(
        const noticia
        of noticias
    ){

        if(
            !noticia ||
            !noticia.titulo
        ){

            continue;

        }


        const clave =
            claveNoticia(
                noticia
            );


        /*
           REPETICIÓN EXACTA
        */

        if(
            claves.has(
                clave
            )
        ){

            continue;

function normalizarTitulo(texto){

        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")

/* ============================================================

============================================================ */

function similitudTitulos(
    tituloA,
    tituloB
){

    const palabrasA =
        normalizarTitulo(
            tituloA

        .split(" ")
        .filter(
            palabra =>
                palabra.length >= 4

    const palabrasB =
