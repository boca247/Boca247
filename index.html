<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boca 24/7</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#061a43;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  background:#0b3d91;
  padding:18px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:28px;
}
header p{
  margin:6px 0 0;
  color:#ffd700;
}
main{
  max-width:850px;
  margin:auto;
  padding:15px;
}
#estado{
  text-align:center;
  padding:12px;
  color:#ffd700;
}
.noticia{
  background:white;
  color:#111;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
}
.noticia h2{
  margin:0 0 8px;
  font-size:19px;
}
.noticia a{
  color:#0645ad;
  font-weight:bold;
  text-decoration:none;
}
.fuente{
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🔵🟡 BOCA 24/7</h1>
  <p>Últimas noticias del Xeneize</p>
</header>

<main>
  <div id="estado">Buscando últimas noticias...</div>
  <div id="noticias"></div>
</main>

<script>

async function cargarNoticias(){

  const estado = document.getElementById("estado");
  const contenedor = document.getElementById("noticias");

  try{

    const respuesta = await fetch("noticias.json?x=" + Date.now());

    if(!respuesta.ok){
      throw new Error("No se pudo cargar noticias.json");
    }

    const noticias = await respuesta.json();

    contenedor.innerHTML = "";

    noticias.forEach(noticia => {

      const tarjeta = document.createElement("div");
      tarjeta.className = "noticia";

      tarjeta.innerHTML = `
        <h2>${noticia.titulo}</h2>
        <div class="fuente">${noticia.fuente}</div>
        <br>
        <a href="${noticia.link}" target="_blank">
          Leer noticia →
        </a>
      `;

      contenedor.appendChild(tarjeta);

    });

    estado.textContent =
      "Actualizado automáticamente • " +
      new Date().toLocaleTimeString("es-AR");

  }catch(error){

    estado.textContent =
      "Esperando la primera actualización automática...";

  }

}

cargarNoticias();

setInterval(cargarNoticias, 5 * 60 * 1000);

</script>

</body>
  </html>
