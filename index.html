<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#001b44">
<meta name="description" content="BOCA 24/7 - Noticias, partidos, mercado, historia, videos y toda la pasión xeneize.">
<meta name="author" content="BOCA 24/7">

<title>BOCA 24/7 | Todo Boca. Todo el día.</title>

<style>

/* =========================================================
   BOCA 24/7
   ESTILOS PRINCIPALES
========================================================= */

:root{
    --azul:#001b44;
    --azul2:#003b7a;
    --azul3:#0759b5;
    --azul4:#0b6ed1;
    --amarillo:#f5c400;
    --amarillo2:#ffd928;
    --blanco:#ffffff;
    --negro:#08111f;
    --gris:#667085;
    --gris2:#f2f5f9;
    --gris3:#dfe5ec;
    --rojo:#df1824;
    --verde:#168a45;
    --sombra:0 10px 35px rgba(0,27,68,.13);
    --radio:18px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    background:var(--gris2);
    color:var(--negro);
    line-height:1.5;
}

body.menu-open{
    overflow:hidden;
}

img{
    max-width:100%;
    display:block;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
select{
    font-family:inherit;
}

/* =========================================================
   BARRA SUPERIOR
========================================================= */

.topbar{
    background:#000f27;
    color:white;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    font-size:12px;
}

.topbar strong{
    color:var(--amarillo);
    letter-spacing:.7px;
}

/* =========================================================
   HEADER
========================================================= */

.site-header{
    background:
        linear-gradient(
            135deg,
            #00122f 0%,
            #002d68 55%,
            #004a9b 100%
        );
    color:white;
    border-bottom:5px solid var(--amarillo);
}

.header-inner{
    max-width:1400px;
    margin:auto;
    min-height:105px;
    padding:18px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand-shield{
    width:70px;
    height:70px;
    flex:0 0 70px;
    border-radius:50%;
    background:var(--amarillo);
    border:4px solid white;
    color:var(--azul);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-weight:1000;
    font-size:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.2);
}

.brand-text h1{
    font-size:34px;
    line-height:1;
    letter-spacing:-1px;
}

.brand-text p{
    color:#dbe8fa;
    font-size:13px;
    margin-top:7px;
}

.header-status{
    display:flex;
    align-items:center;
    gap:10px;
}

.live{
    background:var(--rojo);
    color:white;
    padding:10px 15px;
    border-radius:30px;
    font-size:11px;
    font-weight:900;
    box-shadow:0 4px 15px rgba(223,24,36,.3);
}

.live-dot{
    display:inline-block;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    margin-right:5px;
    animation:pulse 1.4s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.35}
}

/* =========================================================
   NAVEGACIÓN
========================================================= */

.main-nav{
    position:sticky;
    top:0;
    z-index:999;
    background:#003575;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.nav-inner{
    max-width:1400px;
    margin:auto;
    min-height:52px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 15px;
    overflow-x:auto;
}

.nav-inner::-webkit-scrollbar{
    display:none;
}

.nav-link{
    flex:0 0 auto;
    color:white;
    padding:10px 14px;
    border-radius:25px;
    font-size:11px;
    font-weight:900;
    transition:.2s;
    white-space:nowrap;
}

.nav-link:hover,
.nav-link.active{
    background:var(--amarillo);
    color:var(--azul);
}

/* =========================================================
   CONTENEDOR
========================================================= */

.container{
    max-width:1400px;
    margin:auto;
    padding:22px 18px 70px;
}

/* =========================================================
   TICKER
========================================================= */

.ticker{
    background:white;
    border:1px solid var(--gris3);
    border-radius:12px;
    min-height:45px;
    display:flex;
    align-items:center;
    overflow:hidden;
    box-shadow:var(--sombra);
    margin-bottom:20px;
}

.ticker-label{
    background:var(--rojo);
    color:white;
    padding:13px 16px;
    font-size:10px;
    font-weight:1000;
    white-space:nowrap;
}

.ticker-content{
    padding:0 15px;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   PORTADA PRINCIPAL
========================================================= */

.hero-layout{
    display:grid;
    grid-template-columns:minmax(0,2.1fr) minmax(300px,.9fr);
    gap:18px;
}

.hero-main{
    min-height:560px;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    color:white;
    display:flex;
    align-items:flex-end;
    background:
        linear-gradient(
            0deg,
            rgba(0,13,38,.98) 0%,
            rgba(0,20,52,.7) 45%,
            rgba(0,20,52,.08) 100%
        ),
        url("IMG-20260829-WA0001.jpg");
    background-size:cover;
    background-position:center;
    box-shadow:var(--sombra);
}

.hero-main::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.2),
        transparent
    );
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    padding:38px;
    max-width:850px;
}

.category{
    display:inline-flex;
    align-items:center;
    background:var(--amarillo);
    color:var(--azul);
    padding:7px 11px;
    border-radius:5px;
    font-size:10px;
    font-weight:1000;
    margin-bottom:13px;
}

.hero-content h2{
    font-size:clamp(38px,5vw,67px);
    line-height:.98;
    letter-spacing:-2px;
}

.hero-content p{
    max-width:760px;
    margin:18px 0 4px;
    color:#e4edf9;
    font-size:16px;
}

.hero-meta{
    margin-top:13px;
    color:#bdcde2;
    font-size:11px;
}

.hero-button{
    display:inline-block;
    margin-top:18px;
    padding:12px 18px;
    background:var(--amarillo);
    color:var(--azul);
    border-radius:8px;
    font-size:11px;
    font-weight:1000;
    transition:.2s;
}

.hero-button:hover{
    background:white;
}

/* =========================================================
   PORTADA LATERAL
========================================================= */

.hero-side{
    display:grid;
    grid-template-rows:1fr 1fr;
    gap:18px;
}

.side-card{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    min-height:270px;
    background:
        linear-gradient(
            0deg,
            rgba(0,16,43,.97),
            rgba(0,34,83,.25)
        ),
        linear-gradient(
            135deg,
            #0759b5,
            #00132f
        );
    color:white;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    box-shadow:var(--sombra);
}

.side-card.yellow{
    background:
        linear-gradient(
            0deg,
            rgba(0,16,43,.98),
            rgba(0,45,100,.2)
        ),
        url("IMG-20260830-WA0003.jpg");
    background-size:cover;
    background-position:center;
}

.side-label{
    color:var(--amarillo);
    font-size:10px;
    font-weight:1000;
    margin-bottom:7px;
}

.side-card h3{
    font-size:24px;
    line-height:1.05;
}

.side-card p{
    color:#d7e3f3;
    font-size:12px;
    margin-top:7px;
}

.side-button{
    width:max-content;
    margin-top:13px;
    background:white;
    color:var(--azul);
    padding:9px 13px;
    border-radius:7px;
    font-size:10px;
    font-weight:1000;
}

/* =========================================================
   SECCIONES
========================================================= */

.section{
    margin-top:48px;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:15px;
    margin-bottom:17px;
}

.section-title-wrap{
    border-left:7px solid var(--amarillo);
    padding-left:13px;
}

.section-title{
    color:var(--azul);
    font-size:28px;
    line-height:1.1;
    font-weight:1000;
    letter-spacing:-.5px;
}

.section-subtitle{
    color:var(--gris);
    font-size:12px;
    margin-top:5px;
}

.section-link{
    color:var(--azul3);
    font-size:11px;
    font-weight:1000;
    white-space:nowrap;
}

/* =========================================================
   NOTICIAS
========================================================= */

.news-feature-grid{
    display:grid;
    grid-template-columns:1.45fr 1fr 1fr;
    gap:16px;
}

.news-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--sombra);
    transition:transform .2s,box-shadow .2s;
}

.news-card:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 40px rgba(0,27,68,.18);
}

.news-image{
    aspect-ratio:16/9;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(
            135deg,
            #0759b5,
            #00132f
        );
}

.news-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.news-image::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        0deg,
        rgba(0,0,0,.3),
        transparent 55%
    );
}

.news-body{
    padding:18px;
}

.news-category{
    color:var(--azul3);
    font-size:9px;
    font-weight:1000;
    text-transform:uppercase;
}

.news-title{
    color:var(--azul);
    font-size:20px;
    line-height:1.15;
    margin:6px 0 8px;
}

.news-card.featured .news-title{
    font-size:27px;
}

.news-excerpt{
    color:#596579;
    font-size:13px;
}

.news-date{
    color:#98a2b3;
    font-size:10px;
    margin-top:12px;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:16px;
}

/* =========================================================
   FILTROS
========================================================= */

.news-toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:17px;
}

.filter{
    border:1px solid var(--gris3);
    background:white;
    color:var(--azul);
    border-radius:20px;
    padding:9px 13px;
    cursor:pointer;
    font-size:10px;
    font-weight:1000;
}

.filter:hover,
.filter.active{
    background:var(--azul);
    color:white;
    border-color:var(--azul);
}

.search-box{
    margin-left:auto;
    display:flex;
    min-width:240px;
}

.search-box input{
    width:100%;
    border:1px solid var(--gris3);
    border-radius:20px;
    padding:9px 14px;
    outline:none;
}

/* =========================================================
   PARTIDO
========================================================= */

.match{
    background:
        radial-gradient(
            circle at 50% 0%,
            #0a61c3,
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #00132f,
            #003c89
        );
    color:white;
    border-radius:23px;
    padding:30px;
    box-shadow:var(--sombra);
    border-bottom:7px solid var(--amarillo);
}

.match-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.match-pill{
    padding:7px 11px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.1);
    border-radius:8px;
    font-size:9px;
    font-weight:1000;
}

.match-center{
    text-align:center;
    padding:28px 10px;
}

.match-date{
    color:#d5e4f8;
    font-size:11px;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:20px;
    margin-top:8px;
}

.team{
    font-size:clamp(24px,4vw,43px);
    font-weight:1000;
}

.team:last-child{
    text-align:left;
}

.team:first-child{
    text-align:right;
}

.vs{
    color:var(--amarillo);
    font-size:18px;
    font-weight:1000;
}

.match-status{
    margin-top:7px;
    color:#cbd9ec;
    font-size:11px;
}

.match-data{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.match-data-item{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    padding:14px;
    border-radius:12px;
    text-align:center;
    font-size:10px;
}

.match-data-item strong{
    display:block;
    color:var(--amarillo);
    font-size:20px;
}

/* =========================================================
   AGENDA
========================================================= */

.agenda{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.agenda-card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:var(--sombra);
    border-top:5px solid var(--azul3);
}

.agenda-date{
    color:var(--azul3);
    font-size:10px;
    font-weight:1000;
}

.agenda-card h3{
    color:var(--azul);
    margin:5px 0;
    font-size:20px;
}

.agenda-card p{
    color:var(--gris);
    font-size:12px;
}

/* =========================================================
   MERCADO
========================================================= */

.market-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.market-box{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:var(--sombra);
}

.market-box.arrivals{
    border-top:6px solid var(--verde);
}

.market-box.talks{
    border-top:6px solid #d5aa00;
}

.market-box.departures{
    border-top:6px solid var(--rojo);
}

.market-box h3{
    color:var(--azul);
    margin-bottom:8px;
}

.market-row{
    padding:13px 0;
    border-bottom:1px solid var(--gris3);
    font-size:12px;
}

.market-row:last-child{
    border-bottom:0;
}

.market-row strong{
    color:var(--azul);
}

/* =========================================================
   HINCHAS
========================================================= */

.fans-grid{
    display:grid;
    grid-template-columns:1.4fr .8fr;
    gap:16px;
}

.poll,
.mood{
    background:white;
    border-radius:18px;
    padding:24px;
    box-shadow:var(--sombra);
}

.poll h3,
.mood h3{
    color:var(--azul);
    margin:6px 0 15px;
    font-size:21px;
}

.poll-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.poll-btn{
    background:#f7f9fb;
    border:1px solid var(--gris3);
    color:var(--azul);
    border-radius:8px;
    padding:11px 14px;
    cursor:pointer;
    font-weight:900;
    font-size:11px;
}

.poll-btn:hover{
    background:var(--amarillo);
}

.poll-result{
    margin-top:15px;
    color:var(--gris);
    font-size:12px;
}

.progress{
    height:10px;
    background:#e8edf3;
    border-radius:30px;
    overflow:hidden;
    margin:10px 0 14px;
}

.progress span{
    display:block;
    height:100%;
    width:72%;
    background:var(--azul3);
}

/* =========================================================
   VIDEOS
========================================================= */

.video-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.video-card{
    background:#0b0e14;
    color:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--sombra);
}

.video-cover{
    aspect-ratio:16/9;
    background:
        linear-gradient(
            135deg,
            #0759b5,
            #00132f
        );
    display:flex;
    justify-content:center;
    align-items:center;
}

.play{
    width:68px;
    height:68px;
    border-radius:50%;
    background:var(--amarillo);
    color:var(--azul);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    padding-left:4px;
}

.video-content{
    padding:19px;
}

.video-content h3{
    font-size:20px;
}

.video-content p{
    color:#aeb7c4;
    font-size:12px;
    margin-top:6px;
}

/* =========================================================
   FOTOS
========================================================= */

.photo-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:14px;
}

.photo{
    min-height:230px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#062452;
    box-shadow:var(--sombra);
}

.photo:first-child{
    min-height:475px;
    grid-row:span 2;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        0deg,
        rgba(0,0,0,.8),
        transparent 60%
    );
}

.photo-caption{
    position:absolute;
    z-index:2;
    bottom:16px;
    left:16px;
    right:16px;
    color:white;
    font-size:17px;
    font-weight:1000;
}

/* =========================================================
   HISTORIA
========================================================= */

.history{
    background:
        radial-gradient(
            circle at 90% 10%,
            #0759b5,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #00132f,
            #003c89
        );
    color:white;
    padding:32px;
    border-radius:23px;
    box-shadow:var(--sombra);
}

.history h2{
    color:var(--amarillo);
    font-size:30px;
}

.history p{
    color:#d7e4f4;
    max-width:850px;
    margin-top:6px;
}

.timeline{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:25px;
}

.timeline-item{
    padding:17px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
}

.timeline-item strong{
    color:var(--amarillo);
    font-size:25px;
    display:block;
}

.timeline-item span{
    display:block;
    color:#dce8f7;
    font-size:11px;
    margin-top:4px;
}

/* =========================================================
   STREAMING
========================================================= */

.streaming{
    min-height:350px;
    border-radius:23px;
    padding:35px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    color:white;
    background:
        linear-gradient(
            0deg,
            rgba(0,0,0,.92),
            rgba(0,0,0,.15)
        ),
        url("IMG-20260829-WA0003.jpg");
    background-size:cover;
    background-position:center;
    box-shadow:var(--sombra);
    border-bottom:7px solid var(--amarillo);
}

.streaming h2{
    font-size:34px;
}

.streaming p{
    color:#e4e8ed;
    margin-top:5px;
}

.streaming-button{
    width:max-content;
    margin-top:17px;
    background:var(--amarillo);
    color:var(--azul);
    padding:12px 17px;
    border-radius:8px;
    font-size:10px;
    font-weight:1000;
}

/* =========================================================
   FUENTES
========================================================= */

.sources{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
}

.source{
    background:white;
    border-radius:16px;
    padding:19px;
    box-shadow:var(--sombra);
    border-top:5px solid var(--amarillo);
}

.source h3{
    color:var(--azul);
    font-size:17px;
}

.source p{
    color:var(--gris);
    font-size:11px;
    margin-top:4px;
}

.source a{
    display:inline-block;
    margin-top:12px;
    background:var(--azul);
    color:white;
    border-radius:7px;
    padding:9px 12px;
    font-size:9px;
    font-weight:1000;
}

/* =========================================================
   NOTIFICACIONES
========================================================= */

.notifications{
    background:var(--azul);
    color:white;
    border-radius:22px;
