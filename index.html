<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#001b44">
<meta name="description" content="BOCA 24/7 — Noticias, actualidad, partidos, mercado, videos, historia y comunidad Xeneize.">
<title>BOCA 24/7 | Todo Boca. Todo el día.</title>

<style>

/* =========================================================
   BOCA 24/7
   HOJA DE ESTILOS INTEGRADA
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f4f8;
    color:#111827;
    line-height:1.55;
}

body.modal-open{
    overflow:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}

:root{
    --azul:#001b44;
    --azul2:#003b82;
    --azul3:#0759b8;
    --azul4:#0b6ad4;
    --amarillo:#f5c400;
    --amarillo2:#ffd62a;
    --blanco:#ffffff;
    --gris:#667085;
    --gris-claro:#eef2f6;
    --gris-borde:#dfe5ec;
    --negro:#08111f;
    --rojo:#df1720;
    --verde:#159447;
    --sombra:0 12px 35px rgba(0,27,68,.12);
    --sombra2:0 5px 20px rgba(0,0,0,.08);
    --radio:18px;
    --max:1320px;
}

/* =========================================================
   UTILIDADES
========================================================= */

.container{
    width:min(var(--max),calc(100% - 30px));
    margin:auto;
}

.section{
    margin-top:55px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:20px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--azul);
    font-size:30px;
    font-weight:900;
}

.section-title::before{
    content:"";
    display:block;
    width:7px;
    height:34px;
    background:var(--amarillo);
    border-radius:5px;
}

.section-subtitle{
    color:var(--gris);
    font-size:14px;
    margin-top:4px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:0;
    border-radius:9px;
    padding:11px 17px;
    background:var(--azul);
    color:#fff;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    transition:.2s ease;
}

.btn:hover{
    transform:translateY(-2px);
    background:var(--azul3);
}

.btn-yellow{
    background:var(--amarillo);
    color:var(--azul);
}

.btn-yellow:hover{
    background:var(--amarillo2);
}

.btn-red{
    background:var(--rojo);
}

.btn-outline{
    background:transparent;
    border:1px solid var(--gris-borde);
    color:var(--azul);
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
    background:#000f26;
    color:#dce7f5;
    min-height:34px;
    display:flex;
    align-items:center;
    font-size:12px;
}

.topbar-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.topbar strong{
    color:var(--amarillo);
}

/* =========================================================
   HEADER
========================================================= */

header{
    background:
        radial-gradient(circle at 80% 20%,rgba(15,103,210,.35),transparent 30%),
        linear-gradient(135deg,#00152f,#003d91);
    color:#fff;
    border-bottom:5px solid var(--amarillo);
}

.header-inner{
    min-height:105px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand-badge{
    width:70px;
    height:70px;
    border-radius:50%;
    background:var(--amarillo);
    border:4px solid #fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:var(--azul);
    font-weight:1000;
    line-height:1;
    box-shadow:0 0 0 3px rgba(245,196,0,.15);
}

.brand-badge span{
    font-size:13px;
}

.brand h1{
    font-size:35px;
    line-height:1;
    letter-spacing:-1px;
}

.brand p{
    margin-top:6px;
    color:#dce7f5;
    font-size:13px;
}

.header-live{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 15px;
    border-radius:30px;
    background:rgba(223,23,32,.95);
    font-size:11px;
    font-weight:900;
}

.live-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
    animation:pulse 1.4s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.7)}
}

/* =========================================================
   NAV
========================================================= */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:#003477;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
}

.nav-inner{
    display:flex;
    align-items:center;
    gap:7px;
    overflow-x:auto;
    padding:9px 0;
}

.nav-inner::-webkit-scrollbar{
    display:none;
}

.nav-link{
    flex:0 0 auto;
    padding:9px 14px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:30px;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:11px;
    font-weight:900;
    transition:.2s;
}

.nav-link:hover,
.nav-link.active{
    background:var(--amarillo);
    color:var(--azul);
}

/* =========================================================
   TICKER
========================================================= */

main{
    padding-bottom:70px;
}

.ticker{
    margin-top:20px;
    background:#fff;
    border:1px solid var(--gris-borde);
    border-radius:12px;
    min-height:46px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 13px;
    box-shadow:var(--sombra2);
    overflow:hidden;
}

.ticker-label{
    flex:0 0 auto;
    padding:6px 9px;
    background:var(--rojo);
    color:#fff;
    border-radius:5px;
    font-size:10px;
    font-weight:1000;
}

.ticker-content{
    white-space:nowrap;
    overflow:hidden;
}

.ticker-track{
    display:inline-block;
    animation:ticker 30s linear infinite;
}

@keyframes ticker{
    from{transform:translateX(0)}
    to{transform:translateX(-35%)}
}

/* =========================================================
   HERO
========================================================= */

.hero{
    margin-top:20px;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:18px;
}

.hero-main{
    min-height:535px;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:flex-end;
    background:
        linear-gradient(0deg,rgba(0,13,34,.97),rgba(0,17,43,.1) 70%),
        url("IMG-20260829-WA0001.jpg") center/cover;
    box-shadow:var(--sombra);
}

.hero-overlay{
    width:100%;
    padding:38px;
}

.hero-tag{
    display:inline-block;
    background:var(--amarillo);
    color:var(--azul);
    border-radius:6px;
    padding:7px 11px;
    font-size:10px;
    font-weight:1000;
    margin-bottom:13px;
}

.hero-main h2{
    max-width:850px;
    color:#fff;
    font-size:clamp(38px,5vw,68px);
    line-height:.98;
    letter-spacing:-2px;
}

.hero-main p{
    max-width:760px;
    margin:15px 0;
    color:#e6edf7;
    font-size:16px;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.hero-side{
    display:grid;
    gap:18px;
}

.hero-card{
    background:#fff;
    border-radius:20px;
    padding:23px;
    box-shadow:var(--sombra);
    border-left:5px solid var(--azul3);
}

.hero-card.yellow{
    border-left-color:var(--amarillo);
}

.hero-card .small-label{
    color:var(--azul3);
    font-size:10px;
    font-weight:1000;
}

.hero-card h3{
    margin:5px 0;
    color:var(--azul);
    font-size:23px;
}

.hero-card p{
    color:var(--gris);
    font-size:13px;
}

/* =========================================================
   NEWS
========================================================= */

.news-toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.search{
    flex:1 1 280px;
    min-height:44px;
    border:1px solid var(--gris-borde);
    border-radius:10px;
    padding:0 14px;
    outline:none;
    background:#fff;
    color:#111827;
}

.search:focus{
    border-color:var(--azul3);
    box-shadow:0 0 0 3px rgba(7,86,184,.1);
}

.filters{
    display:flex;
    gap:7px;
    overflow:auto;
}

.filter{
    flex:0 0 auto;
    border:1px solid var(--gris-borde);
    background:#fff;
    color:var(--azul);
    border-radius:9px;
    padding:11px 14px;
    cursor:pointer;
    font-size:11px;
    font-weight:900;
}

.filter.active,
.filter:hover{
    background:var(--azul);
    color:#fff;
    border-color:var(--azul);
}

.news-layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.news-card{
    background:#fff;
    border-radius:17px;
    overflow:hidden;
    box-shadow:var(--sombra2);
    border:1px solid #e8edf2;
    transition:.2s;
}

.news-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--sombra);
}

.news-image{
    height:220px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#003b82,#00152f);
}

.news-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.news-category{
    position:absolute;
    top:12px;
    left:12px;
    background:var(--amarillo);
    color:var(--azul);
    border-radius:5px;
    padding:6px 8px;
    font-size:9px;
    font-weight:1000;
}

.news-content{
    padding:18px;
}

.news-source{
    color:var(--azul3);
    font-size:10px;
    font-weight:1000;
    text-transform:uppercase;
}

.news-card h3{
    color:var(--azul);
    font-size:20px;
    line-height:1.18;
    margin:6px 0 8px;
}

.news-card p{
    color:#526071;
    font-size:13px;
}

.news-meta{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-top:14px;
    color:#98a2b3;
    font-size:10px;
}

.news-more{
    margin-top:12px;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar-box{
    background:#fff;
    border-radius:18px;
    box-shadow:var(--sombra2);
    padding:20px;
    margin-bottom:18px;
}

.sidebar-title{
    color:var(--azul);
    font-size:18px;
    font-weight:1000;
    border-left:5px solid var(--amarillo);
    padding-left:9px;
    margin-bottom:14px;
}

.trending{
    display:grid;
    gap:12px;
}

.trending-item{
    display:grid;
    grid-template-columns:34px 1fr;
    gap:10px;
    padding-bottom:12px;
    border-bottom:1px solid var(--gris-borde);
}

.trending-item:last-child{
    border-bottom:0;
    padding-bottom:0;
}

.trending-number{
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--azul);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:1000;
}

.trending-item h4{
    color:var(--azul);
    font-size:13px;
    line-height:1.25;
}

.trending-item small{
    color:var(--gris);
    font-size:10px;
}

/* =========================================================
   ARTICLE MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(0,10,25,.75);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:22px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.modal-image{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
}

.modal-body{
    padding:28px;
}

.modal-source{
    color:var(--azul3);
    font-size:11px;
    font-weight:1000;
}

.modal-body h2{
    color:var(--azul);
    font-size:32px;
    line-height:1.1;
    margin:7px 0;
}

.modal-date{
    color:#98a2b3;
    font-size:11px;
}

.modal-text{
    color:#344054;
    font-size:16px;
    margin-top:20px;
    white-space:pre-line;
}

.modal-close{
    position:absolute;
    top:18px;
    right:18px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:var(--azul);
    font-size:23px;
    cursor:pointer;
}

/* =========================================================
   MATCH CENTER
========================================================= */

.match{
    background:
        radial-gradient(circle at 50% 0,rgba(13,104,210,.5),transparent 45%),
        linear-gradient(135deg,#001331,#064ca4);
    color:#fff;
    border-radius:24px;
    padding:28px;
    box-shadow:var(--sombra);
    border-bottom:7px solid var(--amarillo);
}

.match-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.pill{
    padding:6px 10px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    border-radius:7px;
    font-size:10px;
    font-weight:900;
}

.match-center{
    text-align:center;
    padding:28px 0;
}

.match-date{
    color:#cbd9eb;
    font-size:12px;
}

.match-teams{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:35px;
    margin-top:8px;
}

.team{
    min-width:120px;
    font-size:23px;
    font-weight:1000;
}

.vs{
    color:var(--amarillo);
    font-size:15px;
    font-weight:1000;
}

.match-data{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.match-data-item{
    text-align:center;
    background:rgba(255,255,255,.09);
    padding:13px;
    border-radius:12px;
    font-size:10px;
}

.match-data-item strong{
    display:block;
    color:var(--amarillo);
    font-size:18px;
}

/* =========================================================
   AGENDA
========================================================= */

.agenda{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.agenda-card{
    background:#fff;
    border-radius:17px;
    padding:21px;
    box-shadow:var(--sombra2);
    border-top:5px solid var(--azul3);
}

.agenda-date{
    color:var(--azul3);
    font-size:11px;
    font-weight:1000;
}

.agenda-card h3{
    color:var(--azul);
    font-size:20px;
    margin:5px 0;
}

.agenda-card p{
    color:var(--gris);
    font-size:13px;
}

/* =========================================================
   MERCADO
========================================================= */

.market{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.market-box{
    background:#fff;
    padding:22px;
    border-radius:18px;
    box-shadow:var(--sombra2);
}

.market-box.green{
    border-top:6px solid var(--verde);
}

.market-box.yellow{
    border-top:6px solid #d3a900;
}

.market-box.red{
    border-top:6px solid var(--rojo);
}

.market-box h3{
    color:var(--azul);
    margin-bottom:8px;
}

.market-item{
    padding:13px 0;
    border-bottom:1px solid var(--gris-borde);
    font-size:13px;
}

.market-item:last-child{
    border-bottom:0;
}

.market-item strong{
    color:var(--azul);
}

/* =========================================================
   COMMUNITY / POLL
========================================================= */

.community{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:18px;
}

.poll,
.temperature{
    background:#fff;
    border-radius:18px;
    padding:24px;
    box-shadow:var(--sombra2);
}

.poll h3,
.temperature h3{
    color:var(--azul);
    font-size:21px;
    margin-bottom:14px;
}

.poll-options{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.poll-option{
    border:1px solid var(--gris-borde);
    background:#f8fafc;
    color:var(--azul);
    border-radius:9px;
    padding:11px 15px;
    cursor:pointer;
    font-size:12px;
    font-weight:900;
}

.poll-option:hover{
    background:var(--amarillo);
}

.poll-result{
    margin-top:15px;
    color:var(--gris);
    font-size:13px;
}

.progress{
    height:10px;
    background:#e6ebf1;
    border-radius:99px;
    overflow:hidden;
    margin:10px 0 15px;
}

.progress span{
    display:block;
    height:100%;
    width:72%;
    background:var(--azul3);
}

/* =========================================================
   VIDEOS
========================================================= */

.video-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.video-card{
    background:#09101a;
    border-radius:19px;
    overflow:hidden;
    color:#fff;
    box-shadow:var(--sombra);
}

.video-cover{
    aspect-ratio:16/9;
    background:
        linear-gradient(135deg,rgba(0,59,143,.8),rgba(0,10,30,.95)),
        radial-gradient(circle at center,#0756b8,transparent);
    display:flex;
    align-items:center;
    justify-content:center;
}

.play{
    width:70px;
    height:70px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--rojo);
    font-size:27px;
    padding-left:4px;
}

.video-info{
    padding:19px;
}

.video-info h3{
    font-size:20px;
}

.video-info p{
    color:#aab4c2;
    font-size:13px;
    margin-top:5px;
}

/* =========================================================
   PHOTOS
========================================================= */

.photos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.photo{
    min-height:250px;
    border-radius:18px;
    position:relative;
    overflow:hidden;
    background:#00245f center/cover;
    box-shadow:var(--sombra2);
}

.photo::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(0deg,rgba(0,12,30,.85),transparent 65%);
}

.photo-content{
    position:absolute;
    z-index:2;
    bottom:16px;
    left:17px;
    right:17px;
    color:#fff;
}

.photo-content strong{
    display:block;
    font-size:18px;
}

/* =========================================================
   HISTORY
========================================================= */

.history{
    background:
        radial-gradient(circle at 85% 20%,rgba(13,104,210,.35),transparent 35%),
        linear-gradient(135deg,#001531,#003e91);
    border-radius:23px;
    padding:30px;
    color:#fff;
    box-shadow:var(--sombra);
}

.history h2{
    color:var(--amarillo);
}

.history-intro{
    color:#d9e5f4;
    margin-top:4px;
}

.timeline{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:22px;
}

.timeline-item{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:17px;
}

.timeline-item strong{
    display:block;
    color:var(--amarillo);
    font-size:25px;
}

.timeline-item p{
    color:#dbe6f3;
    font-size:12px;
    margin-top:5px;
}

/* =========================================================
   SOURCES
========================================================= */

.sources{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.source{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:var(--sombra2);
    border-top:5px solid var(--amarillo);
}

.source h3{
    color:var(--azul);
    font-size:17px;
}

.source p{
    color:var(--gris);
    font-size:12px;
    margin:4px 0 10px;
}

/* =========================================================
   STREAMING
========================================================= */

.streaming{
    min-height:350px;
    border-radius:24px;
    padding:35px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    color:#fff;
    background:
        linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,.15)),
        url("IMG-20260829-WA0003.jpg") center/cover;
