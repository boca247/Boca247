<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boca 24/7 | Todo Boca</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f7;
  color:#111;
}

header{
  background:linear-gradient(135deg,#001f5b,#064aa8);
  color:white;
  text-align:center;
  padding:25px 15px;
  border-bottom:7px solid #f5c400;
}

.logo{
  font-size:40px;
  font-weight:900;
  letter-spacing:2px;
}

header p{
  margin-top:7px;
  font-size:15px;
}

nav{
  background:#003b8f;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:11px;
  position:sticky;
  top:0;
  z-index:100;
}

nav button{
  border:0;
  background:white;
  color:#00265f;
  font-weight:bold;
  padding:10px 15px;
  border-radius:22px;
  white-space:nowrap;
  cursor:pointer;
}

nav button:hover{
  background:#f5c400;
}

main{
  max-width:1200px;
  margin:auto;
  padding:20px 15px 50px;
}

.hero{
  background:linear-gradient(135deg,#00245f,#0756b8);
  color:white;
  padding:28px;
  border-radius:18px;
  border-bottom:6px solid #f5c400;
  margin-bottom:28px;
}

.hero-label{
  color:#f5c400;
  font-weight:bold;
  margin-bottom:10px;
}

.hero h2{
  font-size:29px;
  line-height:1.25;
  margin-bottom:12px;
}

.hero p{
  line-height:1.6;
}

.fuentes{
  background:#00245f;
  padding:20px;
  border-radius:16px;
  margin-bottom:30px;
}

.fuentes h2{
  color:#f5c400;
  margin-bottom:15px;
}

.fuentes-lista{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.fuente{
  background:white;
  color:#00245f;
  padding:9px 14px;
  border-radius:20px;
  font-weight:bold;
}

.seccion{
  margin-bottom:35px;
}

.seccion-titulo{
  color:#00245f;
  font-size:25px;
  border-left:7px solid #f5c400;
  padding-left:12px;
  margin-bottom:17px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:15px;
  padding:19px;
  border-top:5px solid #064aa8;
  box-shadow:0 3px 12px rgba(0,0,0,.09);
}

.card:hover{
  transform:translateY(-3px);
}

.card-fuente{
  color:#064aa8;
  font-size:14px;
  font-weight:bold;
}

.card h3{
  font-size:20px;
  line-height:1.3;
  margin:8px 0;
}

.fecha{
  color:#777;
  font-size:13px;
  margin-bottom:11px;
}

.resumen{
  color:#444;
  line-height:1.55;
}

.leer{
  display:inline-block;
  margin-top:15px;
  background:#064aa8;
  color:white;
  padding:9px 13px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.leer:hover{
  background:#f5c400;
  color:#00245f;
}

.vacio{
  background:white;
  border-radius:12px;
  padding:25px;
  text-align:center;
  color:#666;
}

footer{
  background:#00245f;
  color:white;
  text-align:center;
  padding:30px 15px;
  border-top:7px solid #f5c400;
}

footer strong{
  color:#f5c400;
  font-size:22px;
}

@media(max-width:600px){
  .logo{font-size:29px}
  .hero h2{font-size:23px}
  .seccion-titulo{font-size:21px}
}
</style>
</head>

<body>

<header>
  <div class="logo">BOCA 24/7</div>
  <p>Todo Boca. Todo el tiempo.</p>
</header>

<nav>
  <button onclick="inicio()">Inicio</button>
  <button onclick="seccion('Boca')">Boca</button>
  <button onclick="seccion('Sudamericana')">Sudamericana</button>
  <button onclick="seccion('Partidos')">Partidos</button>
  <button onclick="seccion('Mercado de pases')">Mercado de pases</button>
  <button onclick="seccion('Plantel')">Plantel</button>
  <button onclick="seccion('Lesiones')">Lesiones</button>
  <button onclick="seccion('Básquet')">Básquet</button>
  <button onclick="seccion('Futsal')">Futsal</button>
  <button onclick="seccion('Fútbol femenino')">Fútbol femenino</button>
  <button onclick="seccion('Obras')">Obras</button>
  <button onclick="seccion('Reserva')">Reserva</button>
  <button onclick="seccion('Inferiores')">Inferiores</button>
  <button onclick="seccion('La Bombonera')">La Bombonera</button>
  <button onclick="seccion('Tato Aguilera')">Tato</button>
  <button onclick="seccion('Diego Monroig')">Monroig</button>
  <button onclick="seccion('Augusto César')">Augusto</button>
  <button onclick="seccion('Canal de Boca')">Canal de Boca</button>
  <button onclick="seccion('Oficial')">Boca Oficial</button>
</nav>

<main>

  <section id="hero"></section>

  <section class="fuentes">
    <h2>Fuentes de información</h2>

    <div class="fuentes-lista">
      <span class="fuente">Tato Aguilera</span>
      <span class="fuente">Diego Monroig</span>
      <span class="fuente">Augusto César</span>
      <span class="fuente">El Canal de Boca</span>
      <span class="fuente">Boca Juniors Oficial</span>
      <span class="fuente">TyC Sports</span>
      <span class="fuente">TN</span>
    </div>
  </section>

  <section class="seccion">
    <h2 class="seccion-titulo" id="titulo">
      Últimas noticias
    </h2>

    <div id="noticias" class="grid">
      <div class="vacio">Cargando noticias...</div>
    </div>
  </section>

</main>

<footer>
  <strong>BOCA 24/7</strong>
  <p style="margin-top:8px">
    Información Xeneize todos los días.
  </p>
</footer>

<script>

let noticias=[];

async function cargarNoticias(){

  try{

    const respuesta=await fetch(
      "noticias.json?actualizacion="+Date.now()
    );

    if(!respuesta.ok){
      throw new Error("Error cargando noticias");
    }

    noticias=await respuesta.json();

    inicio();

  }catch(error){

    document.getElementById("noticias").innerHTML=
      '<div class="vacio">No se pudieron cargar las noticias.</div>';

  }
}

function escapar(texto){

  const div=document.createElement("div");

  div.textContent=texto || "";

  return div.innerHTML;
}

function crearTarjeta(n){

  let boton="";

  if(n.link){

    boton=`
      <a
        class="leer"
        href="${escapar(n.link)}"
        target="_blank"
        rel="noopener noreferrer">
        Leer noticia →
      </a>
    `;
  }

  return `
    <article class="card">

      <div class="card-fuente">
        ${escapar(n.fuente || "Boca 24/7")}
      </div>

      <h3>
        ${escapar(n.titulo || "Sin título")}
      </h3>

      <div class="fecha">
        ${escapar(n.fecha || "")}
        ${n.hora ? " · "+escapar(n.hora) : ""}
      </div>

      <div class="resumen">
        ${escapar(n.contenido || "")}
      </div>

      ${boton}

    </article>
  `;
}

function mostrar(lista){

  const contenedor=document.getElementById("noticias");

  if(!lista.length){

    contenedor.innerHTML=`
      <div class="vacio">
        Todavía no hay noticias en esta sección.
      </div>
    `;

    return;
  }

  contenedor.innerHTML=
    lista.map(crearTarjeta).join("");
}

function inicio(){

  document.getElementById("titulo").textContent=
    "Últimas noticias";

  mostrar(noticias);

  if(noticias.length){

    const n=noticias[0];

    document.getElementById("hero").innerHTML=`

      <div class="hero">

        <div class="hero-label">
          🔥 NOTICIA DESTACADA
        </div>

        <h2>
          ${escapar(n.titulo)}
        </h2>

        <p>
          ${escapar(n.contenido)}
        </p>

        <p style="margin-top:12px">
          <strong>${escapar(n.fuente || "")}</strong>
          ·
          ${escapar(n.fecha || "")}
        </p>

      </div>

    `;
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function seccion(categoria){

  const lista=noticias.filter(n => {

    const valor=(n.categoria || "")
      .toLowerCase()
      .trim();

    return valor===categoria.toLowerCase().trim();
  });

  document.getElementById("titulo").textContent=
    categoria;

  document.getElementById("hero").innerHTML="";

  mostrar(lista);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

cargarNoticias();

</script>

</body>
</html>
