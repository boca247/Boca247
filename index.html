 
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boca 24/7 - Noticias</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    header {
      background: linear-gradient(135deg, #061b49, #0b3d91);
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 6px;
      opacity: .9;
    }

    nav {
      background: #063b91;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav button {
      border: none;
      background: white;
      color: #063b91;
      padding: 10px 15px;
      border-radius: 20px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }

    nav button:hover {
      background: #e7e7e7;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px 15px 50px;
    }

    .seccion {
      margin-bottom: 35px;
    }

    .seccion h2 {
      border-left: 6px solid #063b91;
      padding-left: 10px;
      margin-bottom: 15px;
      font-size: 24px;
    }

    .noticias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .noticia {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      transition: transform .2s;
    }

    .noticia:hover {
      transform: translateY(-3px);
    }

    .fuente {
      color: #063b91;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .noticia h3 {
      font-size: 20px;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .fecha {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .contenido {
      color: #444;
      line-height: 1.5;
      font-size: 15px;
    }

    .fuentes-box {
      background: #061b49;
      color: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 35px;
    }

    .fuentes-box h2 {
      margin-bottom: 15px;
    }

    .fuentes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .fuente-item {
      background: white;
      color: #061b49;
      padding: 10px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .estado {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    footer {
      background: #061b49;
      color: white;
      text-align: center;
      padding: 25px 15px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      .noticia h3 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>BOCA 24/7</h1>
  <p>Todo Boca. Todo el tiempo.</p>
</header>

<nav>
  <button onclick="mostrarTodo()">Inicio</button>
  <button onclick="mostrarCategoria('Boca')">Boca</button>
  <button onclick="mostrarCategoria('Noticias')">Noticias</button>
  <button onclick="mostrarCategoria('Mercado de pases')">Mercado de pases</button>
  <button onclick="mostrarCategoria('Partidos')">Partidos</button>
  <button onclick="mostrarCategoria('Sudamericana')">Sudamericana</button>
</nav>

<main>

  <section class="fuentes-box">
    <h2>Fuentes</h2>

    <div class="fuentes">
      <div class="fuente-item">Tato</div>
      <div class="fuente-item">Diego</div>
      <div class="fuente-item">Canal de Boca</div>
      <div class="fuente-item">Boca 24/7</div>
    </div>
  </section>

  <section class="seccion">
    <h2 id="titulo-seccion">Últimas noticias</h2>

    <div id="contenedor-noticias" class="noticias">
      <div class="estado">Cargando noticias...</div>
    </div>
  </section>

</main>

<footer>
  <strong>BOCA 24/7</strong>
  <p>Información Xeneize las 24 horas.</p>
</footer>

<script>

let todasLasNoticias = [];

async function cargarNoticias() {

  const contenedor = document.getElementById("contenedor-noticias");

  try {

    const respuesta = await fetch("noticias.json");

    if (!respuesta.ok) {
      throw new Error("No se pudo cargar noticias.json");
    }

    todasLasNoticias = await respuesta.json();

    mostrarNoticias(todasLasNoticias);

  } catch (error) {

    console.error(error);

    contenedor.innerHTML = `
      <div class="estado">
        No se pudieron cargar las noticias.
        <br>
        Revisá que el archivo noticias.json esté en el repositorio.
      </div>
    `;
  }
}


function mostrarNoticias(noticias) {

  const contenedor = document.getElementById("contenedor-noticias");

  if (!noticias || noticias.length === 0) {

    contenedor.innerHTML = `
      <div class="estado">
        No hay noticias disponibles.
      </div>
    `;

    return;
  }

  contenedor.innerHTML = "";

  noticias.forEach(noticia => {

    const tarjeta = document.createElement("article");

    tarjeta.className = "noticia";

    tarjeta.innerHTML = `
      <div class="fuente">
        ${escaparHTML(noticia.fuente || "Boca 24/7")}
      </div>

      <h3>
        ${escaparHTML(noticia.titulo || "Sin título")}
      </h3>

      <div class="fecha">
        ${escaparHTML(noticia.fecha || "")}
      </div>

      <div class="contenido">
        ${escaparHTML(noticia.contenido || "")}
      </div>
    `;

    contenedor.appendChild(tarjeta);

  });
}


function mostrarTodo() {

  document.getElementById("titulo-seccion").textContent =
    "Últimas noticias";

  mostrarNoticias(todasLasNoticias);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function mostrarCategoria(categoria) {

  const filtradas = todasLasNoticias.filter(noticia =>
    noticia.categoria &&
    noticia.categoria.toLowerCase() === categoria.toLowerCase()
  );

  document.getElementById("titulo-seccion").textContent =
    categoria;

  mostrarNoticias(filtradas);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function escaparHTML(texto) {

  const div = document.createElement("div");

  div.textContent = texto;

  return div.innerHTML;
}


cargarNoticias();

</script>

</body>
</html>
