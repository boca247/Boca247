 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boca 24/7</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#111;
}

header{
  background:#06265f;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:36px;
  font-weight:900;
}

header p{
  margin:6px 0 0;
}

nav{
  background:#041b43;
  display:flex;
  justify-content:center;
  gap:25px;
  padding:14px;
  flex-wrap:wrap;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

nav a:hover{
  color:#ffd400;
}

.contenedor{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.titulo{
  font-size:26px;
  font-weight:bold;
  border-left:6px solid #ffd400;
  padding-left:10px;
  margin-bottom:20px;
}

.noticias{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.fuente{
  background:#06265f;
  color:white;
  padding:10px 15px;
  font-size:12px;
  font-weight:bold;
}

.contenido{
  padding:18px;
}

.contenido h2{
  font-size:19px;
  line-height:1.3;
  margin:0 0 12px;
}

.contenido p{
  color:#666;
  line-height:1.5;
}

.leer{
  display:inline-block;
  margin-top:10px;
  padding:10px 15px;
  background:#06265f;
  color:white;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.leer:hover{
  background:#041b43;
}

#noticiaCompleta{
  display:none;
  background:white;
  border-radius:12px;
  padding:25px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

#noticiaCompleta h2{
  font-size:28px;
  line-height:1.3;
}

#noticiaCompleta p{
  font-size:17px;
  line-height:1.7;
}

.volver{
  display:inline-block;
  margin-bottom:20px;
  padding:10px 15px;
  background:#06265f;
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

footer{
  margin-top:40px;
  background:#041b43;
  color:white;
  text-align:center;
  padding:25px;
}

.cargando{
  text-align:center;
  padding:30px;
}

@media(max-width:800px){
  .noticias{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:550px){
  .noticias{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:29px;
  }

  #noticiaCompleta h2{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header>
  <h1>BOCA 24/7</h1>
  <p>Todo Boca, todo el tiempo</p>
</header>

<nav>
  <a href="#" onclick="mostrarInicio()">INICIO</a>
  <a href="#" onclick="mostrarInicio()">NOTICIAS</a>
  <a href="#" onclick="mostrarInicio()">BOCA</a>
  <a href="#" onclick="mostrarInicio()">MERCADO DE PASES</a>
</nav>

<main class="contenedor">

<section id="inicio">

  <div class="titulo">
    Últimas noticias de Boca
  </div>

  <div id="listaNoticias" class="noticias">
    <div class="cargando">
      Cargando noticias...
    </div>
  </div>

</section>

<section id="noticiaCompleta">

  <div class="volver" onclick="mostrarInicio()">
    ← Volver a noticias
  </div>

  <div class="fuente" id="fuenteNoticia"></div>

  <h2 id="tituloNoticia"></h2>

  <p id="textoNoticia"></p>

</section>

</main>

<footer>
  BOCA 24/7 · Toda la actualidad del Xeneize
</footer>

<script>

let noticias = [];

async function cargarNoticias(){

  try{

    const respuesta = await fetch("Noticias");

    noticias = await respuesta.json();

    const contenedor = document.getElementById("listaNoticias");

    contenedor.innerHTML = "";

    noticias.forEach(function(noticia, indice){

      const tarjeta = document.createElement("article");

      tarjeta.className = "card";

      tarjeta.innerHTML = `
        <div class="fuente">
          ${noticia.fuente}
        </div>

        <div class="contenido">

          <h2>
            ${noticia.titulo}
          </h2>

          <p>
            ${noticia.contenido}
          </p>

          <span
            class="leer"
            onclick="abrirNoticia(${indice})">
            Leer noticia
          </span>

        </div>
      `;

      contenedor.appendChild(tarjeta);

    });

  }catch(error){

    document.getElementById("listaNoticias").innerHTML =
      "<p>No se pudieron cargar las noticias.</p>";

  }

}


function abrirNoticia(indice){

  const noticia = noticias[indice];

  document.getElementById("inicio").style.display = "none";

  document.getElementById("noticiaCompleta").style.display = "block";

  document.getElementById("fuenteNoticia").innerText =
    noticia.fuente;

  document.getElementById("tituloNoticia").innerText =
    noticia.titulo;

  document.getElementById("textoNoticia").innerText =
    noticia.contenido;

  window.scrollTo(0,0);

}


function mostrarInicio(){

  document.getElementById("noticiaCompleta").style.display = "none";

  document.getElementById("inicio").style.display = "block";

  window.scrollTo(0,0);

}


cargarNoticias();

</script>

</body>
</html>
