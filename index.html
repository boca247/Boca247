<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boca Noticias</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #0b2a5b;
      color: white;
      padding: 22px 16px;
      text-align: center;
      border-bottom: 5px solid #f5c400;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 18px 12px 40px;
    }

    .estado {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 14px;
    }

    .noticias {
      display: grid;
      gap: 15px;
    }

    .noticia {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    }

    .noticia h2 {
      color: #0b2a5b;
      font-size: 21px;
      line-height: 1.25;
      margin-bottom: 9px;
    }

    .fuente {
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
    }

    .contenido {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .boton {
      display: inline-block;
      background: #0b2a5b;
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .boton:hover {
      background: #17478f;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #777;
      font-size: 13px;
    }

    .cargando {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: #fff0f0;
      color: #a00000;
      border: 1px solid #ffcccc;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔵🟡 BOCA NOTICIAS</h1>
    <p>Las últimas noticias del Xeneize</p>
  </header>

  <main class="container">

    <div class="estado" id="estado">
      Actualizando noticias...
    </div>

    <section class="noticias" id="noticias">
      <div class="cargando">
        Cargando noticias de Boca...
      </div>
    </section>

  </main>

  <footer>
    Boca Noticias · Información del mundo Xeneize
  </footer>

  <script>

    const noticias = [
      {
        titulo: "Boca se prepara para su próximo desafío",
        fuente: "Boca Noticias",
        contenido: "El equipo Xeneize continúa trabajando y se prepara para sus próximos compromisos.",
        link: "https://www.google.com/search?q=Boca+Juniors+ultimas+noticias"
      },
      {
        titulo: "Todas las novedades del mundo Boca",
        fuente: "Noticias Boca Juniors",
        contenido: "Mercado de pases, partidos, resultados, declaraciones y toda la actualidad del Xeneize.",
        link: "https://www.google.com/search?q=Boca+Juniors+ultimas+noticias"
      },
      {
        titulo: "Boca Juniors: últimas noticias",
        fuente: "Actualidad Xeneize",
        contenido: "Enterate de las principales novedades de Boca y seguí toda la información del club.",
        link: "https://www.google.com/search?q=Boca+Juniors+ultimas+noticias"
      }
    ];

    function mostrarNoticias() {

      const contenedor = document.getElementById("noticias");
      const estado = document.getElementById("estado");

      contenedor.innerHTML = "";

      noticias.forEach(noticia => {

        const tarjeta = document.createElement("article");

        tarjeta.className = "noticia";

        tarjeta.innerHTML = `
          <h2>${noticia.titulo}</h2>

          <div class="fuente">
            Fuente: ${noticia.fuente}
          </div>

          <div class="contenido">
            ${noticia.contenido}
          </div>

          <a
            class="boton"
            href="${noticia.link}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Leer más
          </a>
        `;

        contenedor.appendChild(tarjeta);

      });

      estado.textContent =
        "Última actualización: " +
        new Date().toLocaleString("es-AR");

    }

    mostrarNoticias();

  </script>

</body>
</html>
