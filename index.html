<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boca 24/7 | Todo Boca</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f7;
    color:#111;
}

/* ENCABEZADO */

header{
    width:100%;
    background:#001f5b;
    color:white;
    text-align:center;
    padding:0 0 20px;
    border-bottom:7px solid #f5c400;
}

.logo-img{
    width:100%;
    height:auto;
    display:block;
    margin:0;
    padding:0;
}

/* TÍTULO */

.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:2px;
    margin-top:15px;
}

header p{
    margin-top:7px;
    font-size:15px;
}

/* MENÚ */

nav{
    width:100%;
    background:#003b8f;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:11px;
    position:sticky;
    top:0;
    z-index:100;
}

nav button{
    border:0;
    background:white;
    color:#00265f;
    font-weight:bold;
    padding:10px 15px;
    border-radius:22px;
    white-space:nowrap;
    cursor:pointer;
}

nav button:hover{
    background:#f5c400;
}

/* CONTENIDO */

main{
    max-width:1200px;
    margin:auto;
    padding:20px 15px 50px;
}

.actualizado{
    background:white;
    padding:12px 15px;
    border-radius:10px;
    margin-bottom:20px;
    color:#555;
    font-size:14px;
    text-align:center;
}

/* DESTACADA */

.hero{
    background:linear-gradient(135deg,#00245f,#0756b8);
    color:white;
    padding:28px;
    border-radius:18px;
    border-bottom:6px solid #f5c400;
    margin-bottom:28px;
}

.hero-label{
    color:#f5c400;
    font-weight:bold;
    margin-bottom:10px;
}

.hero h2{
    font-size:29px;
    line-height:1.25;
    margin-bottom:12px;
}

.hero p{
    line-height:1.6;
}

/* FUENTES */

.fuentes{
    background:#00245f;
    padding:20px;
    border-radius:16px;
    margin-bottom:30px;
}

.fuentes h2{
    color:#f5c400;
    margin-bottom:15px;
}

.fuentes-lista{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.fuente{
    background:white;
    color:#00245f;
    padding:9px 14px;
    border-radius:20px;
    font-weight:bold;
}

/* NOTICIAS */

.seccion{
    margin-bottom:35px;
}

.seccion-titulo{
    color:#00245f;
    font-size:25px;
    border-left:7px solid #f5c400;
    padding-left:12px;
    margin-bottom:17px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.card{
    background:white;
    border-radius:15px;
    padding:19px;
    border-top:5px solid #064aa8;
    box-shadow:0 3px 12px rgba(0,0,0,.09);
}

.card-fuente{
    color:#064aa8;
    font-size:14px;
    font-weight:bold;
}

.card h3{
    font-size:20px;
    line-height:1.3;
    margin:8px 0;
}

.fecha{
    color:#777;
    font-size:13px;
    margin-bottom:11px;
}

.resumen{
    color:#444;
    line-height:1.55;
}

.leer{
    display:inline-block;
    margin-top:15px;
    background:#064aa8;
    color:white;
    padding:9px 13px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.leer:hover{
    background:#f5c400;
    color:#00245f;
}

.vacio{
    background:white;
    border-radius:12px;
    padding:25px;
    text-align:center;
    color:#666;
}

/* PIE */

footer{
    background:#00245f;
    color:white;
    text-align:center;
    padding:30px 15px;
    border-top:7px solid #f5c400;
}

footer strong{
    color:#f5c400;
    font-size:22px;
}

/* CELULAR */

@media(max-width:600px){

    .logo-img{
        width:100%;
        height:auto;
    }

    .logo{
        font-size:29px;
    }

    .hero h2{
        font-size:23px;
    }

    .seccion-titulo{
        font-size:21px;
    }

}

</style>
</head>

<body>

<header>

    <img
        class="logo-img"
        src="IMG-20260829-WA0001.jpg"
        alt="Agrupación Boca 24/7"
    >

    <div class="logo">
        BOCA 24/7
    </div>

    <p>
        Todo Boca. Todo el tiempo.
    </p>

</header>

<nav>

    <button onclick="inicio()">Inicio</button>

    <button onclick="seccion('Boca')">
        Boca
    </button>

    <button onclick="seccion('Sudamericana')">
        Sudamericana
    </button>

    <button onclick="seccion('Mercado de pases')">
        Mercado de pases
    </button>

    <button onclick="seccion('Lesiones')">
        Lesiones
    </button>

    <button onclick="seccion('Básquet')">
        Básquet
    </button>

    <button onclick="seccion('Futsal')">
        Futsal
    </button>

    <button onclick="seccion('Fútbol femenino')">
        Fútbol femenino
    </button>

    <button onclick="seccion('Reserva')">
        Reserva
    </button>

    <button onclick="seccion('Inferiores')">
        Inferiores
    </button>

    <button onclick="seccion('La Bombonera')">
        La Bombonera
    </button>

</nav>

<main>

    <div
        class="actualizado"
        id="actualizado">

        Cargando información...

    </div>

    <section id="hero"></section>

    <section class="fuentes">

        <h2>
            Fuentes de información
        </h2>

        <div class="fuentes-lista">

            <span class="fuente">
                Google Noticias
            </span>

            <span class="fuente">
                TyC Sports
            </span>

            <span class="fuente">
                Boca Juniors
            </span>

        </div>

    </section>

    <section class="seccion">

        <h2
            class="seccion-titulo"
            id="titulo">

            Últimas noticias

        </h2>

        <div
            id="noticias"
            class="grid">

            <div class="vacio">

                Cargando noticias...

            </div>

        </div>

    </section>

</main>

<footer>

    <strong>
        BOCA 24/7
    </strong>

    <p style="margin-top:8px">
        Información Xeneize todos los días.
    </p>

</footer>

<script>

let noticias = [];


function escapar(texto){

    const div =
        document.createElement("div");

    div.textContent =
        texto || "";

    return div.innerHTML;

}


function mostrarFecha(noticia){

    if(noticia.fecha_iso){

        const fecha =
            new Date(
                noticia.fecha_iso
            );

        if(!isNaN(fecha.getTime())){

            return new Intl.DateTimeFormat(
                "es-AR",
                {
                    timeZone:
                        "America/Argentina/Buenos_Aires",

                    day:"2-digit",

                    month:"2-digit",

                    year:"numeric",

                    hour:"2-digit",

                    minute:"2-digit",

                    hour12:false
                }
            ).format(fecha);

        }

    }

    return (
        noticia.fecha || ""
    ) +
    (
        noticia.hora
        ? " - " + noticia.hora
        : ""
    );

}


function crearTarjeta(noticia){

    let boton = "";

    if(noticia.link){

        boton = `

            <a
                class="leer"
                href="${escapar(noticia.link)}"
                target="_blank"
                rel="noopener noreferrer">

                Leer noticia

            </a>

        `;

    }

    return `

        <article class="card">

            <div class="card-fuente">

                ${escapar(
                    noticia.fuente ||
                    "Boca 24/7"
                )}

            </div>

            <h3>

                ${escapar(
                    noticia.titulo ||
                    "Sin título"
                )}

            </h3>

            <div class="fecha">

                ${mostrarFecha(noticia)}

            </div>

            <div class="resumen">

                ${escapar(
                    noticia.contenido ||
                    ""
                )}

            </div>

            ${boton}

        </article>

    `;

}


function mostrar(lista){

    const contenedor =
        document.getElementById(
            "noticias"
        );

    if(!lista.length){

        contenedor.innerHTML = `

            <div class="vacio">

                No hay noticias en esta sección.

            </div>

        `;

        return;

    }

    contenedor.innerHTML =
        lista
        .map(crearTarjeta)
        .join("");

}


function inicio(){

    document.getElementById(
        "titulo"
    ).textContent =
        "Últimas noticias";

    mostrar(noticias);

    const hero =
        document.getElementById(
            "hero"
        );

    if(!noticias.length){

        hero.innerHTML = "";

        return;

    }

    const noticia =
        noticias[0];

    hero.innerHTML = `

        <div class="hero">

            <div class="hero-label">

                NOTICIA DESTACADA

            </div>

            <h2>

                ${escapar(
                    noticia.titulo ||
                    "Última noticia"
                )}

            </h2>

            <p>

                ${escapar(
                    noticia.contenido ||
                    ""
                )}

            </p>

            <p style="margin-top:12px">

                <strong>

                    ${escapar(
                        noticia.fuente ||
                        ""
                    )}

                </strong>

            </p>

        </div>

    `;

}


function seccion(categoria){

    const lista =
        noticias.filter(
            function(noticia){

                return (
                    noticia.categoria ||
                    ""
                )
                .toLowerCase()
                .trim()
                ===
                categoria
                .toLowerCase()
                .trim();

            }
        );

    document.getElementById(
        "titulo"
    ).textContent =
        categoria;

    document.getElementById(
        "hero"
    ).innerHTML = "";

    mostrar(lista);

}


async function cargarNoticias(){

    try{

        const respuesta =
            await fetch(
                "noticias.json?v=" +
                Date.now()
            );

        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar noticias.json"
            );

        }

        noticias =
            await respuesta.json();

        noticias.sort(
            function(a,b){

                return new Date(
                    b.fecha_iso || 0
                )
                -
                new Date(
                    a.fecha_iso || 0
                );

            }
        );

        inicio();

        document.getElementById(
            "actualizado"
        ).textContent =

            "Última actualización: " +

            new Intl.DateTimeFormat(
                "es-AR",
                {
                    timeZone:
                        "America/Argentina/Buenos_Aires",

                    day:"2-digit",

                    month:"2-digit",

                    year:"numeric",

                    hour:"2-digit",

                    minute:"2-digit",

                    hour12:false
                }
            ).format(
                new Date()
            );

    }

    catch(error){

        console.error(error);

        document.getElementById(
            "noticias"
        ).innerHTML = `

            <div class="vacio">

                No se pudieron cargar
                las noticias.

            </div>

        `;

    }

}


cargarNoticias();


setInterval(
    cargarNoticias,
    5 * 60 * 1000
);

</script>

</body>
</html>
