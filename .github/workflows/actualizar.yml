name: Actualizar noticias de Boca

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener noticias
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          feeds = [
              ("Olé", "https://www.ole.com.ar/rss.html"),
              ("TyC Sports", "https://www.tycsports.com/rss/pages/boca-juniors.html"),
              ("Google Noticias Boca", "https://news.google.com/rss/search?q=Boca+Juniors&hl=es-419&gl=AR&ceid=AR:es-419")
          ]

          noticias = []

          for fuente, url in feeds:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  data = urllib.request.urlopen(req, timeout=20).read()
                  root = ET.fromstring(data)

                  for item in root.findall(".//item")[:10]:
                      titulo = item.findtext("title")
                      link = item.findtext("link")

                      if titulo and link:
                          noticias.append({
                              "titulo": titulo.strip(),
                              "fuente": fuente,
                              "link": link.strip()
                          })

              except Exception as e:
                  print("Error:", fuente, e)

          unicas = []
          vistos = set()

          for noticia in noticias:
              if noticia["titulo"] not in vistos:
                  vistos.add(noticia["titulo"])
                  unicas.append(noticia)

          with open("noticias.json", "w", encoding="utf-8") as archivo:
              json.dump(unicas[:30], archivo, ensure_ascii=False, indent=2)

          print("Noticias actualizadas:", len(unicas))
          PY

      - name: Publicar actualización
        run: |
          git config user.name "Boca 24/7"
          git config user.email "boca247@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || git commit -m "Noticias actualizadas"
          git push
