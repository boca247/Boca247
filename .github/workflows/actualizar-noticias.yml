name: Actualizar noticias.json

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # también permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el actualizador
        run: python actualizador.py

      - name: Commitear noticias.json si cambió
        run: |
          git config user.name "boca247-bot"
          git config user.email "actions@github.com"
          git add noticias.json
          git diff --staged --quiet || git commit -m "Actualizar noticias.json [bot]"
          git push
