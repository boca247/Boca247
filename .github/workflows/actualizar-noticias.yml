name: Actualizar noticias Boca 24/7

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install feedparser requests beautifulsoup4

      - name: Actualizar noticias
        run: python actualizar_noticias.py

      - name: Guardar cambios
        run: |
          git config user.name "Boca 24/7 Bot"
          git config user.email "boca247-bot@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || git commit -m "Noticias actualizadas automáticamente"
          git push
