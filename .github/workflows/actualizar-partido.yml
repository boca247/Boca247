name: Actualizar partido Boca 24/7

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  actualizar-partido:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Instalar requests
        run: |
          pip install requests

      - name: Actualizar partido
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python actualizar_partido.py

      - name: Guardar partido
        run: |

          git config user.name "Boca 24/7 Bot"
          git config user.email "boca247-bot@users.noreply.github.com"

          git add partido.json

          git diff --cached --quiet || git commit -m "Partido actualizado automáticamente"

          git push
